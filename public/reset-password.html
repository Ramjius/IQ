<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramtechnologies — Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand img { height: 80px; object-fit: contain; }
    .brand h1 { margin: 10px 0 2px; font-size: 24px; color: #212121; }
    .brand p { margin: 0; color: #777; font-size: 14px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.11); width: 400px; max-width: 96vw; padding: 32px; }
    .card h2 { margin: 0 0 8px; font-size: 20px; color: #212121; }
    .card .sub { font-size: 13px; color: #777; margin-bottom: 24px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
    input { width: 100%; padding: 10px 13px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 15px; }
    input:focus { outline: none; border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,0.15); }
    .btn { width: 100%; padding: 12px; background: #212121; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 4px; }
    .btn:hover { background: #4caf50; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { padding: 12px 14px; border-radius: 5px; font-size: 13px; margin-bottom: 18px; display: none; }
    .msg.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .hint { font-size: 11px; color: #bbb; margin-top: -10px; margin-bottom: 14px; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; text-decoration: none; }
    .back:hover { color: #4caf50; }
    .invalid-card { text-align: center; padding: 12px 0; }
    .invalid-card .icon { font-size: 48px; margin-bottom: 12px; }
    .invalid-card p { color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="/logo.png" alt="Ramtechnologies" onerror="this.style.display='none'">
    <h1>Ramtechnologies</h1>
    <p>Invoicing &amp; Quotation Manager</p>
  </div>

  <div class="card" id="card">
    <div id="loadingArea" style="text-align:center;color:#888;padding:20px 0;">Validating reset link...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    async function init() {
      const card = document.getElementById('card');
      if (!token) {
        showInvalid('No reset token provided.');
        return;
      }
      try {
        const r = await fetch(`/api/auth/validate-reset-token?token=${encodeURIComponent(token)}`);
        const data = await r.json();
        if (!r.ok || !data.valid) {
          showInvalid(data.error || 'This reset link is invalid or has expired.');
        } else {
          showForm();
        }
      } catch (e) {
        showInvalid('Could not validate reset link. Please try again.');
      }
    }

    function showInvalid(msg) {
      document.getElementById('card').innerHTML = `
        <div class="invalid-card">
          <div class="icon">🔗</div>
          <h2 style="margin:0 0 8px;font-size:20px;">Link Expired or Invalid</h2>
          <p>${msg}</p>
          <a href="/forgot-password" style="display:inline-block;margin-top:16px;padding:10px 24px;background:#212121;color:white;border-radius:6px;text-decoration:none;font-weight:bold;">Request a New Link</a>
        </div>
        <a href="/login" class="back" style="display:block;text-align:center;margin-top:20px;font-size:13px;color:#aaa;text-decoration:none;">← Back to Sign In</a>
      `;
    }

    function showForm() {
      document.getElementById('card').innerHTML = `
        <h2>Set New Password</h2>
        <p class="sub">Choose a strong new password for your account.</p>
        <div class="msg" id="msg"></div>
        <div id="formArea">
          <label>New Password</label>
          <input type="password" id="newPwd" placeholder="At least 6 characters" autocomplete="new-password">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPwd" placeholder="Repeat your new password" autocomplete="new-password">
          <button class="btn" id="submitBtn" onclick="doReset()">Set New Password</button>
        </div>
        <a href="/login" class="back">← Back to Sign In</a>
      `;
      document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
    }

    async function doReset() {
      const newPwd = document.getElementById('newPwd').value;
      const confirmPwd = document.getElementById('confirmPwd').value;
      const btn = document.getElementById('submitBtn');

      if (!newPwd || !confirmPwd) { showMsg('error', 'Please fill in both fields.'); return; }
      if (newPwd.length < 6) { showMsg('error', 'Password must be at least 6 characters.'); return; }
      if (newPwd !== confirmPwd) { showMsg('error', 'Passwords do not match.'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: newPwd })
        });
        const data = await r.json();
        if (r.ok && data.success) {
          document.getElementById('formArea').style.display = 'none';
          showMsg('success', 'Password updated! Redirecting you to sign in...');
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          showMsg('error', data.error || 'Failed to reset password. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      } catch (e) {
        showMsg('error', 'Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
    }

    function showMsg(type, text) {
      const msg = document.getElementById('msg');
      if (!msg) return;
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }

    init();
  </script>
</body>
</html>
