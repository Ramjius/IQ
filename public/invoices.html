<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoicing App - Invoice</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #ffffff; color: black; }
    header h1 { margin: 0; font-size: 36px; }
    header img { height: 60px; }
    .nav-menu { background-color: #212121; padding: 10px 20px; text-align: center; }
    .nav-menu a { color: white; text-decoration: none; margin: 0 15px; font-size: 16px; padding: 5px 10px; border-radius: 4px; transition: background-color 0.3s; }
    .nav-menu a:hover { background-color: #424242; }
    .nav-menu a.active { background-color: #4caf50; }
    .form-container { max-width: 900px; margin: 30px auto; background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; min-width: 0; }
    .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #ddd; overflow: hidden; }
    th { background-color: #f5f5f5; font-size: 13px; }
    col.col-desc { width: 40%; }
    col.col-qty  { width: 12%; }
    col.col-price { width: 18%; }
    col.col-total { width: 18%; }
    col.col-action { width: 12%; }
    .item-input { width: 100%; padding: 5px; border: 1px solid #ddd; border-radius: 3px; box-sizing: border-box; font-size: 13px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-add { background-color: #4caf50; color: white; margin-bottom: 10px; }
    .btn-remove { background-color: #f44336; color: white; padding: 5px 8px; font-size: 12px; }
    .btn-save { background-color: #2196f3; color: white; margin-right: 10px; }
    .btn-update { background-color: #ff9800; color: white; margin-right: 10px; }
    .btn-export { background-color: #e91e63; color: white; }
    .total-section { text-align: right; font-size: 18px; font-weight: bold; margin: 15px 0; }
    .actions { margin-top: 20px; }
    .edit-badge { background: #ff9800; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-left: 12px; vertical-align: middle; }
    #clientModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-box { background: white; width: 420px; margin: 80px auto; padding: 24px; border-radius: 8px; }
    .client-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .client-item:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">New Invoice</h1>
    <img src="/logo.png" alt="Company Logo">
  </header>
  <div class="nav-menu">
    <a href="/">Dashboard</a>
    <a href="/invoices" class="active">Invoices</a>
    <a href="/quotations">Quotations</a>
    <a href="/clients">Clients</a>
  </div>
  <div class="form-container">
    <form id="invoiceForm">
      <div class="form-row">
        <div class="form-group">
          <label>Invoice Number</label>
          <input type="text" id="invoiceNumber" name="invoiceNumber" placeholder="e.g. 202601">
          <input type="hidden" id="originalInvoiceNumber">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status" name="status">
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="overdue">Overdue</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Customer Name</label>
          <div style="display: flex; gap: 5px;">
            <input type="text" id="customerName" name="customerName" required style="flex:1; min-width:0;">
            <button type="button" class="btn btn-save" style="flex-shrink:0; padding:6px 12px;" onclick="showClientPicker()">Load</button>
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address" name="address">
        </div>
      </div>

      <!-- Client Picker Modal -->
      <div id="clientModal">
        <div class="modal-box">
          <h3 style="margin-top:0;">Select Client</h3>
          <div id="clientList" style="max-height: 300px; overflow-y: auto; margin-bottom: 16px; border: 1px solid #eee; border-radius: 4px;"></div>
          <button type="button" class="btn btn-remove" onclick="document.getElementById('clientModal').style.display='none'">Close</button>
        </div>
      </div>

      <div class="form-group">
        <label>Payment Details</label>
        <input type="text" id="paymentDetails" name="paymentDetails" value="CHEQUE NAME: RAMTECHNOLOGIES">
      </div>

      <h3>Items</h3>
      <div class="table-wrapper">
        <table id="itemsTable">
          <colgroup>
            <col class="col-desc">
            <col class="col-qty">
            <col class="col-price">
            <col class="col-total">
            <col class="col-action">
          </colgroup>
          <thead>
            <tr>
              <th>Description</th>
              <th>Qty</th>
              <th>Unit Price (Kshs)</th>
              <th>Line Total (Kshs)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>
      <button type="button" class="btn btn-add" onclick="addItem()">+ Add Item</button>

      <div class="total-section">
        Total Amount: Kshs <span id="totalAmount">0.00</span>
      </div>

      <div class="actions" id="actionButtons"></div>
    </form>
  </div>

  <script>
    let items = [];
    let editMode = false;

    // Detect edit mode from URL
    const urlParams = new URLSearchParams(window.location.search);
    const editNumber = urlParams.get('edit');

    if (editNumber) {
      editMode = true;
      document.getElementById('pageTitle').innerHTML = 'Edit Invoice <span class="edit-badge">Editing</span>';
      loadInvoiceForEdit(editNumber);
      renderActionButtons();
    } else {
      fetch('/api/next-invoice-number')
        .then(r => r.json())
        .then(data => { document.getElementById('invoiceNumber').value = data.invoiceNumber; });
      addItem();
      renderActionButtons();
    }

    function loadInvoiceForEdit(invoiceNumber) {
      fetch('/api/invoice/' + encodeURIComponent(invoiceNumber))
        .then(r => r.json())
        .then(inv => {
          document.getElementById('invoiceNumber').value = inv.invoice_number;
          document.getElementById('originalInvoiceNumber').value = inv.invoice_number;
          document.getElementById('customerName').value = inv.customer_name || '';
          document.getElementById('address').value = inv.address || '';
          document.getElementById('paymentDetails').value = inv.payment_details || 'CHEQUE NAME: RAMTECHNOLOGIES';
          const statusEl = document.getElementById('status');
          for (let i = 0; i < statusEl.options.length; i++) {
            if (statusEl.options[i].value === inv.status) { statusEl.selectedIndex = i; break; }
          }
          items = Array.isArray(inv.items) ? inv.items : [];
          renderItems();
          updateTotal();
        })
        .catch(err => { alert('Failed to load invoice: ' + err.message); });
    }

    function renderActionButtons() {
      const container = document.getElementById('actionButtons');
      if (editMode) {
        container.innerHTML = '<button type="button" class="btn btn-update" onclick="updateInvoice()">Update Invoice</button><button type="button" class="btn btn-export" onclick="exportPDF()">Export PDF</button>';
      } else {
        container.innerHTML = '<button type="button" class="btn btn-save" onclick="saveInvoice()">Save Invoice</button><button type="button" class="btn btn-export" onclick="exportPDF()">Export PDF</button>';
      }
    }

    function addItem() {
      items.push({ description: '', quantity: '', unitPrice: '', lineTotal: '' });
      renderItems();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderItems();
      updateTotal();
    }

    function renderItems() {
      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';
      items.forEach((item, idx) => {
        const row = document.createElement('tr');
        row.innerHTML =
          '<td><input class="item-input" type="text" value="' + escVal(item.description) + '" onchange="updateItem(' + idx + ', \'description\', this.value)"></td>' +
          '<td><input class="item-input" type="number" min="0" value="' + escVal(item.quantity) + '" onchange="updateItem(' + idx + ', \'quantity\', this.value)"></td>' +
          '<td><input class="item-input" type="number" min="0" value="' + escVal(item.unitPrice) + '" onchange="updateItem(' + idx + ', \'unitPrice\', this.value)"></td>' +
          '<td><input class="item-input" type="number" value="' + escVal(item.lineTotal) + '" readonly></td>' +
          '<td><button type="button" class="btn btn-remove" onclick="removeItem(' + idx + ')">&#x2715;</button></td>';
        tbody.appendChild(row);
      });
    }

    function escVal(v) { return (v || '').toString().replace(/"/g, '&quot;'); }

    function updateItem(idx, field, value) {
      items[idx][field] = value;
      if (field === 'quantity' || field === 'unitPrice') {
        const qty = parseFloat(items[idx].quantity) || 0;
        const price = parseFloat(items[idx].unitPrice) || 0;
        items[idx].lineTotal = (qty * price).toFixed(2);
        renderItems();
      }
      updateTotal();
    }

    function updateTotal() {
      const total = items.reduce((sum, item) => sum + (parseFloat(item.lineTotal) || 0), 0);
      document.getElementById('totalAmount').textContent = total.toFixed(2);
    }

    function getFormData() {
      return {
        invoiceNumber: document.getElementById('invoiceNumber').value.trim(),
        originalInvoiceNumber: document.getElementById('originalInvoiceNumber').value,
        customerName: document.getElementById('customerName').value,
        address: document.getElementById('address').value,
        paymentDetails: document.getElementById('paymentDetails').value,
        status: document.getElementById('status').value,
        items: items,
        totalAmount: document.getElementById('totalAmount').textContent
      };
    }

    function showClientPicker() {
      fetch('/api/clients')
        .then(r => r.json())
        .then(clients => {
          const list = document.getElementById('clientList');
          list.innerHTML = '';
          if (clients.length === 0) {
            list.innerHTML = '<p style="padding:10px;">No clients found</p>';
          } else {
            clients.forEach(c => {
              const div = document.createElement('div');
              div.className = 'client-item';
              div.innerHTML = '<strong>' + c.name + '</strong><br><small>' + (c.address || '') + '</small>';
              div.onclick = function() {
                document.getElementById('customerName').value = c.name;
                document.getElementById('address').value = c.address || '';
                document.getElementById('clientModal').style.display = 'none';
              };
              list.appendChild(div);
            });
          }
          document.getElementById('clientModal').style.display = 'block';
        });
    }

    function saveInvoice() {
      const data = getFormData();
      if (!data.invoiceNumber) { alert('Please enter an invoice number'); return; }
      if (!data.customerName) { alert('Please enter customer name'); return; }
      fetch('/api/save-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => r.json()).then(result => {
        if (result.success) window.location.href = '/';
        else alert(result.error || 'Failed to save invoice');
      }).catch(err => alert('Error: ' + err.message));
    }

    function updateInvoice() {
      const data = getFormData();
      if (!data.invoiceNumber) { alert('Please enter an invoice number'); return; }
      if (!data.customerName) { alert('Please enter customer name'); return; }
      fetch('/api/update-invoice', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => r.json()).then(result => {
        if (result.success) { window.location.href = '/'; }
        else alert(result.error || 'Failed to update invoice');
      }).catch(err => alert('Error: ' + err.message));
    }

    function exportPDF() {
      const data = getFormData();
      if (!data.customerName) { alert('Please enter customer name'); return; }
      fetch('/api/export-invoice-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => {
        if (r.ok) return r.blob();
        throw new Error('Failed to export PDF');
      }).then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = data.invoiceNumber + '-' + data.customerName + '.pdf';
        a.click();
      }).catch(err => alert(err.message));
    }
  </script>
</body>
</html>
