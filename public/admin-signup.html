<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); padding: 40px; width: 420px; }
    .logo-wrap { text-align: center; margin-bottom: 24px; }
    .logo-wrap img { height: 70px; object-fit: contain; }
    h2 { text-align: center; margin: 0 0 6px; color: #212121; }
    .subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #444; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,0.15); }
    .btn { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #43a047; }
    .msg { font-size: 13px; margin-bottom: 12px; text-align: center; display: none; padding: 8px; border-radius: 4px; }
    .msg.error { color: #e53935; background: #ffebee; display: block; }
    .msg.success { color: #2e7d32; background: #e8f5e9; display: block; }
    .info-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; padding: 12px; font-size: 13px; color: #5d4037; margin-bottom: 20px; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #777; }
    .footer-link a { color: #2196f3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><img src="/logo.png" alt="Logo" onerror="this.style.display='none'"></div>
    <h2>Create Admin Account</h2>
    <p class="subtitle">Set up your administrator account</p>
    <div class="info-box" id="infoBox">This will create the first admin account. After this, new accounts can only be added from within the admin panel.</div>
    <div class="msg" id="msgBox"></div>
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
    <label>Password</label>
    <input type="password" id="password" placeholder="Choose a strong password" autocomplete="new-password">
    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
    <button class="btn" onclick="signup()">Create Account</button>
    <div class="footer-link"><a href="/admin/login">Back to Login</a></div>
  </div>
  <script>
    // Check if users already exist; if so, redirect to login
    fetch('/api/auth/has-users').then(r => r.json()).then(data => {
      if (data.hasUsers) {
        document.getElementById('infoBox').textContent = 'An admin account already exists. Please log in to add more accounts.';
      }
    });

    async function signup() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'msg';
      msgBox.style.display = 'none';

      if (!username || !email || !password) { show('error', 'All fields are required'); return; }
      if (password !== confirm) { show('error', 'Passwords do not match'); return; }
      if (password.length < 6) { show('error', 'Password must be at least 6 characters'); return; }

      const r = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await r.json();
      if (r.ok && data.success) {
        show('success', 'Account created! Redirecting to login...');
        setTimeout(() => { window.location.href = '/admin/login'; }, 1500);
      } else {
        show('error', data.error || 'Signup failed');
      }
    }

    function show(type, msg) {
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'msg ' + type;
      msgBox.textContent = msg;
      msgBox.style.display = 'block';
    }
  </script>
</body>
</html>
