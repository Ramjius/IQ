<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); padding: 40px; width: 380px; }
    .logo-wrap { text-align: center; margin-bottom: 24px; }
    .logo-wrap img { height: 70px; object-fit: contain; }
    h2 { text-align: center; margin: 0 0 8px; color: #212121; }
    .subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #444; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #2196f3; box-shadow: 0 0 0 2px rgba(33,150,243,0.15); }
    .btn { width: 100%; padding: 12px; background: #212121; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #424242; }
    .error { color: #e53935; font-size: 13px; margin-bottom: 12px; text-align: center; display: none; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #777; }
    .footer-link a { color: #2196f3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><img src="/logo.png" alt="Logo" onerror="this.style.display='none'"></div>
    <h2>Admin Panel</h2>
    <p class="subtitle">Sign in to manage your app settings</p>
    <div class="error" id="errorMsg"></div>
    <label>Username or Email</label>
    <input type="text" id="username" placeholder="Enter username or email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    <button class="btn" onclick="login()">Sign In</button>
    <div class="footer-link">
      Don't have an account? <a href="/admin/signup">Create first admin account</a>
    </div>
  </div>
  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      if (!username || !password) { showError('Please fill in all fields'); return; }
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (r.ok && data.success) {
        window.location.href = '/admin';
      } else {
        showError(data.error || 'Login failed');
      }
    }
    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.style.display = 'block';
    }
  </script>
</body>
</html>
