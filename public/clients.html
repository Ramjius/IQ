<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #fff; }
    header h1 { margin: 0; font-size: 32px; }
    header img { height: 55px; }
    .nav-menu { background: #212121; padding: 10px 20px; text-align: center; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .nav-menu a { color: white; text-decoration: none; margin: 0 6px; font-size: 15px; padding: 5px 12px; border-radius: 4px; transition: background 0.2s; }
    .nav-menu a:hover { background: #424242; }
    .nav-menu a.active { background: #4caf50; }
    .container { max-width: 1050px; margin: 28px auto; padding: 0 16px; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat { background: white; border-radius: 8px; padding: 14px 22px; flex: 1; min-width: 130px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stat .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
    .stat .value { font-size: 26px; font-weight: bold; color: #212121; margin-top: 2px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; margin-bottom: 18px; align-items: center; flex-wrap: wrap; }
    .toolbar input[type=text] { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .toolbar input[type=text]:focus { outline: none; border-color: #4caf50; }
    .btn { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn-primary { background: #212121; color: white; }
    .btn-primary:hover { background: #424242; }
    .btn-success { background: #4caf50; color: white; }
    .btn-success:hover { background: #43a047; }
    .btn-edit { background: #ff9800; color: white; padding: 5px 12px; font-size: 12px; }
    .btn-delete { background: #e53935; color: white; padding: 5px 12px; font-size: 12px; }

    /* Table */
    .table-card { background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { background: #f5f5f5; padding: 11px 14px; text-align: left; font-size: 13px; color: #555; border-bottom: 2px solid #e0e0e0; }
    td { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .empty-row td { text-align: center; color: #aaa; padding: 32px; }
    .actions-cell { display: flex; gap: 6px; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 10px; padding: 30px; width: 480px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal h2 { margin: 0 0 20px; font-size: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
    .form-group input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #4caf50; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .btn-cancel { background: #eee; color: #444; }
    .btn-cancel:hover { background: #ddd; }

    /* Confirm dialog */
    .confirm-box { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: center; justify-content: center; }
    .confirm-box.open { display: flex; }
    .confirm-inner { background: white; border-radius: 10px; padding: 28px 30px; width: 360px; text-align: center; }
    .confirm-inner p { margin: 0 0 20px; font-size: 15px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }

    .toast { position: fixed; bottom: 28px; right: 28px; padding: 11px 20px; border-radius: 6px; color: white; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.success { background: #43a047; }
    .toast.error { background: #e53935; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
  <header>
    <h1>Clients</h1>
    <img src="/logo.png" alt="Logo" onerror="this.style.display='none'">
  </header>
  <div class="nav-menu">
    <a href="/">Dashboard</a>
    <a href="/invoices">Invoices</a>
    <a href="/quotations">Quotations</a>
    <a href="/clients" class="active">Clients</a>
    <a href="/expenses">Expenses</a>
    <a href="/analytics">Analytics</a>
    <a href="/taxes">Taxes</a>
  </div>

  <div class="container">
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat">
        <div class="label">Total Clients</div>
        <div class="value" id="statTotal">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by name, email or phone..." oninput="handleSearch()">
      <button class="btn btn-success" onclick="openAddModal()">+ Add Client</button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Address</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Added</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="clientsBody">
            <tr class="empty-row"><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <h2 id="modalTitle">Add Client</h2>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Name <span style="color:#e53935">*</span></label>
        <input type="text" id="fieldName" placeholder="Client or company name">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="fieldAddress" placeholder="Physical address">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="fieldEmail" placeholder="Email address">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="fieldPhone" placeholder="Phone number">
      </div>
      <div id="modalError" style="color:#e53935;font-size:13px;display:none;margin-bottom:10px;"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" onclick="saveClient()">Save Client</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="confirm-box" id="confirmBox">
    <div class="confirm-inner">
      <p id="confirmMsg">Are you sure you want to delete this client?</p>
      <div class="confirm-actions">
        <button class="btn btn-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-delete" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allClients = [];
    let deleteTargetId = null;
    let searchTimer = null;

    loadClients();

    async function loadClients(search) {
      const url = '/api/clients' + (search ? '?search=' + encodeURIComponent(search) : '');
      const data = await fetch(url).then(r => r.json());
      allClients = data;
      document.getElementById('statTotal').textContent = data.length;
      renderTable(data);
    }

    function handleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadClients(document.getElementById('searchInput').value.trim());
      }, 280);
    }

    function renderTable(clients) {
      const tbody = document.getElementById('clientsBody');
      if (!clients.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No clients found</td></tr>';
        return;
      }
      tbody.innerHTML = clients.map((c, i) => `
        <tr>
          <td style="color:#aaa;font-size:12px;">${i + 1}</td>
          <td><strong>${esc(c.name)}</strong></td>
          <td>${esc(c.address) || '<span style="color:#bbb">—</span>'}</td>
          <td>${c.email ? `<a href="mailto:${esc(c.email)}" style="color:#1565c0;text-decoration:none;">${esc(c.email)}</a>` : '<span style="color:#bbb">—</span>'}</td>
          <td>${c.phone ? `<a href="tel:${esc(c.phone)}" style="color:#1565c0;text-decoration:none;">${esc(c.phone)}</a>` : '<span style="color:#bbb">—</span>'}</td>
          <td style="color:#888;font-size:12px;">${c.created_at ? new Date(c.created_at).toLocaleDateString() : '—'}</td>
          <td>
            <div class="actions-cell">
              <button class="btn btn-edit" onclick="openEditModal(${c.id})">Edit</button>
              <button class="btn btn-delete" onclick="askDelete(${c.id}, '${esc(c.name).replace(/'/g, "\\'")}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function esc(s) {
      return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Client';
      document.getElementById('editId').value = '';
      document.getElementById('fieldName').value = '';
      document.getElementById('fieldAddress').value = '';
      document.getElementById('fieldEmail').value = '';
      document.getElementById('fieldPhone').value = '';
      document.getElementById('modalError').style.display = 'none';
      document.getElementById('clientModal').classList.add('open');
      setTimeout(() => document.getElementById('fieldName').focus(), 60);
    }

    function openEditModal(id) {
      const c = allClients.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Client';
      document.getElementById('editId').value = c.id;
      document.getElementById('fieldName').value = c.name || '';
      document.getElementById('fieldAddress').value = c.address || '';
      document.getElementById('fieldEmail').value = c.email || '';
      document.getElementById('fieldPhone').value = c.phone || '';
      document.getElementById('modalError').style.display = 'none';
      document.getElementById('clientModal').classList.add('open');
      setTimeout(() => document.getElementById('fieldName').focus(), 60);
    }

    function closeModal() {
      document.getElementById('clientModal').classList.remove('open');
    }

    async function saveClient() {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('fieldName').value.trim();
      const address = document.getElementById('fieldAddress').value.trim();
      const email = document.getElementById('fieldEmail').value.trim();
      const phone = document.getElementById('fieldPhone').value.trim();
      const errEl = document.getElementById('modalError');

      if (!name) { errEl.textContent = 'Name is required'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      const payload = { name, address, email, phone };
      const url = id ? `/api/clients/${id}` : '/api/clients';
      const method = id ? 'PUT' : 'POST';

      const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await r.json();
      if (r.ok && data.success) {
        closeModal();
        toast(id ? 'Client updated' : 'Client added', 'success');
        loadClients(document.getElementById('searchInput').value.trim());
      } else {
        errEl.textContent = data.error || 'Failed to save client';
        errEl.style.display = 'block';
      }
    }

    function askDelete(id, name) {
      deleteTargetId = id;
      document.getElementById('confirmMsg').textContent = `Delete "${name}"? This cannot be undone.`;
      document.getElementById('confirmBox').classList.add('open');
    }

    function closeConfirm() {
      deleteTargetId = null;
      document.getElementById('confirmBox').classList.remove('open');
    }

    async function confirmDelete() {
      if (!deleteTargetId) return;
      const r = await fetch(`/api/clients/${deleteTargetId}`, { method: 'DELETE' });
      const data = await r.json();
      closeConfirm();
      if (r.ok && data.success) {
        toast('Client deleted', 'success');
        loadClients(document.getElementById('searchInput').value.trim());
      } else {
        toast(data.error || 'Failed to delete client', 'error');
      }
    }

    // Close modal on overlay click
    document.getElementById('clientModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('confirmBox').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeConfirm();
    });

    // Enter key to save
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeConfirm(); }
      if (e.key === 'Enter' && document.getElementById('clientModal').classList.contains('open')) saveClient();
    });

    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + type + ' show';
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
