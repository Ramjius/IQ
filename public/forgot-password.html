<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramtechnologies — Forgot Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand img { height: 80px; object-fit: contain; }
    .brand h1 { margin: 10px 0 2px; font-size: 24px; color: #212121; }
    .brand p { margin: 0; color: #777; font-size: 14px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.11); width: 400px; max-width: 96vw; padding: 32px; }
    .card h2 { margin: 0 0 8px; font-size: 20px; color: #212121; }
    .card .sub { font-size: 13px; color: #777; margin-bottom: 24px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
    input { width: 100%; padding: 10px 13px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 15px; }
    input:focus { outline: none; border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,0.15); }
    .btn { width: 100%; padding: 12px; background: #212121; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 4px; }
    .btn:hover { background: #4caf50; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { padding: 12px 14px; border-radius: 5px; font-size: 13px; margin-bottom: 18px; display: none; }
    .msg.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; text-decoration: none; }
    .back:hover { color: #4caf50; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="/logo.png" alt="Ramtechnologies" onerror="this.style.display='none'">
    <h1>Ramtechnologies</h1>
    <p>Invoicing &amp; Quotation Manager</p>
  </div>

  <div class="card">
    <h2>Forgot Password</h2>
    <p class="sub">Enter the email address linked to your account and we'll send you a password reset link.</p>
    <div class="msg" id="msg"></div>
    <div id="formArea">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" autocomplete="email">
      <button class="btn" id="submitBtn" onclick="sendReset()">Send Reset Link</button>
    </div>
    <a href="/login" class="back">← Back to Sign In</a>
  </div>

  <script>
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendReset(); });

    async function sendReset() {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      msg.className = 'msg';

      if (!email) { showMsg('error', 'Please enter your email address.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const r = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await r.json();
        if (r.ok) {
          showMsg('success', 'If that email is registered, you\'ll receive a reset link shortly. Check your inbox (and spam folder).');
          document.getElementById('formArea').style.display = 'none';
        } else {
          showMsg('error', data.error || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      } catch (e) {
        showMsg('error', 'Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    function showMsg(type, text) {
      const msg = document.getElementById('msg');
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }
  </script>
</body>
</html>
